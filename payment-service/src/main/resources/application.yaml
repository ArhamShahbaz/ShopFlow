spring:
  application:
    name: payment-service
  datasource:
    url: jdbc:postgresql://localhost:5432/shopflow_payment
    username: payment_user
    password: payment_pass
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
