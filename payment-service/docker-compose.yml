services:
  payment-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: shopflow-payment-service
    ports:
      - "8083:8083"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://shopflow-postgres:5432/shopflow_payment
      SPRING_DATASOURCE_USERNAME: payment_user
      SPRING_DATASOURCE_PASSWORD: payment_pass
      SPRING_KAFKA_BOOTSTRAP_SERVERS: shopflow-kafka:9092
    networks:
      - shopflow-network
    depends_on:
      - shopflow-postgres
      - shopflow-kafka

networks:
  shopflow-network:
    external: true
