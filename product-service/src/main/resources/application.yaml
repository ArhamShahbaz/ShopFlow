spring:
  application:
    name: product-service

  datasource:
    url: jdbc:postgresql://localhost:5432/shopflow_product
    username: product_user
    password: product_pass
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  security:
    oauth2:
      client:
        registration:
          keyclock:
            client-id: api-gateway
            client-secret: ${KEYCLOCK_CLIENT_SECRET_KEY}
            scope:
              - openid
              - profile
              - email
            authorization-grant-type: authorization_code
            redirect-uri: http://localhost:8080/login/oauth2/code/keyclock
        provider:
          keyclock:
            issuer-uri: http://localhost:8180/realms/shopflow
            user-name-attribute: preferred_username

