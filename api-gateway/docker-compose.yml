services:
  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: shopflow-api-gateway
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    networks:
      - shopflow-network
    depends_on:
      - shopflow-kafka

networks:
  shopflow-network:
    external: true
