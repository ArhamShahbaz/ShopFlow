spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: PRODUCT-SERVICE
              uri: lb://product-service
              predicates:
                - Path=/product-service/**
              filters:
                - StripPrefix=1

            - id: INVENTORY-SERVICE
              uri: lb://inventory-service
              predicates:
                - Path=/inventory-service/**
              filters:
                - StripPrefix=1

            - id: ORDER-SERVICE
              uri: lb://order-service
              predicates:
                - Path=/order-service/**
              filters:
                - StripPrefix=1

  security:
    oauth2:
      client:
        registration:
          keyclock:
            client-id: api-gateway
            client-secret: ${KEYCLOCK_CLIENT_SECRET_KEY}
            scope:
              - openid
              - profile
              - email
            authorization-grant-type: authorization_code
            redirect-uri: http://localhost:8080/login/oauth2/code/keyclock
        provider:
          keyclock:
            issuer-uri: http://localhost:8180/realms/shopflow
            user-name-attribute: preferred_username

server:
  port: 8080

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8762/eureka/

logging:
  level:
    org.springframework.boot.autoconfigure: DEBUG
    com.arham.api_gateway: DEBUG


management:
  endpoints:
    web:
      exposure:
        include: "*"