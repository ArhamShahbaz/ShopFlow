spring:
  application:
    name: notification-service


  security:
    oauth2:
      client:
        registration:
          keyclock:
            client-id: api-gateway
            client-secret: ${KEYCLOCK_CLIENT_SECRET_KEY}
            scope:
              - openid
              - profile
              - email
            authorization-grant-type: authorization_code
            redirect-uri: http://localhost:8080/login/oauth2/code/keyclock
        provider:
          keyclock:
            issuer-uri: http://localhost:8180/realms/shopflow
            user-name-attribute: preferred_username

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: notification-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        "[spring.json.trusted.packages]": "com.arham.notificationservice.dto"
        "[spring.json.value.default.type]": "com.arham.notificationservice.dto.OrderResponse"
        "[spring.json.use.type.headers]": false


server:
  port: 8085

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8762/eureka/
