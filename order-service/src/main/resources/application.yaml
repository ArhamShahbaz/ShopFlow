spring:
  application:
    name: order-service

  datasource:
    url: jdbc:postgresql://localhost:5432/shopflow_order
    username: order_user
    password: order_pass
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  security:
    oauth2:
      client:
        registration:
          keyclock:
            client-id: api-gateway
            client-secret: ${KEYCLOCK_CLIENT_SECRET_KEY}
            scope:
              - openid
              - profile
              - email
            authorization-grant-type: authorization_code
            redirect-uri: http://localhost:8080/login/oauth2/code/keyclock
        provider:
          keyclock:
            issuer-uri: http://localhost:8180/realms/shopflow
            user-name-attribute: preferred_username

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: order-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer


server:
  port: 8081

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8762/eureka/


#  resilience4j
resilience4j:
  circuitbreaker:
    configs:
      default:

              # =====================================================================
              # 1. CLOSED STATE PROPERTIES (Normal operation)
              # =====================================================================
              # Type of sliding window used to record outcomes (COUNT_BASED or TIME_BASED)
              slidingWindowType: COUNT_BASED
              # Number of calls recorded in the closed state window
              slidingWindowSize: 8
              # Min calls needed within the window before evaluating thresholds
              minimumNumberOfCalls: 6
              # % of failed calls that will trigger transition from CLOSED to OPEN
              failureRateThreshold: 60
              # Duration threshold above which a call is considered slow
              slowCallDurationThreshold: 10ms
              # % of slow calls that will trigger transition from CLOSED to OPEN
              slowCallRateThreshold: 75

              # =====================================================================
              # 2. OPEN STATE PROPERTIES (Short-circuiting state)
              # =====================================================================
              # Time the circuit stays OPEN before moving to HALF_OPEN
              waitDurationInOpenState: 10s
              # Automatically flips to HALF_OPEN after wait duration without needing a new call
              automaticTransitionFromOpenToHalfOpenEnabled: true

              # =====================================================================
              # 3. HALF_OPEN STATE PROPERTIES (Testing state)
              # =====================================================================
              # Number of permitted trial calls allowed to evaluate health
              permittedNumberOfCallsInHalfOpenState: 5
              # Maximum time allowed to wait for trial calls in HALF_OPEN before forced back to OPEN
              maxWaitDurationInHalfOpenState: 0s
              ignoreExceptions:
                - com.arham.orderservice.exception.ResourceNotFoundException

    instances:
      productServiceCircuitBreaker:
        baseConfig: default


